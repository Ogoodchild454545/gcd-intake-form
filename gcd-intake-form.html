<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The GCD Clinic — New Client Intake</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1C2B4A;
  --yellow: #F0C419;
  --cream: #F5F5F5;
  --white: #fff;
  --border: #DCDCDC;
  --muted: #6B7A99;
  --error: #C0392B;
}
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--navy); min-height: 100vh; }

.header { background: var(--navy); padding: 18px 32px; border-bottom: 3px solid var(--yellow); }
.header h1 { color: #fff; font-size: 18px; font-weight: 500; }
.header p { color: var(--yellow); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }

.progress-bar { height: 4px; background: var(--border); }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--navy), var(--yellow)); transition: width 0.4s; width: 0%; }

.container { max-width: 660px; margin: 0 auto; padding: 40px 20px 80px; }

.section { display: none; }
.section.active { display: block; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.step-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.section h2 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400; color: var(--navy); margin-bottom: 8px; }
.section p.sub { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }

.block-head {
  font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 400; color: var(--navy);
  margin: 34px 0 4px; padding-top: 22px; border-top: 1px solid var(--border);
}
.block-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

.field { margin-bottom: 24px; }
label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 7px; }
label .req { color: var(--error); margin-left: 2px; }
label .opt { color: var(--muted); font-weight: 300; font-size: 13px; margin-left: 4px; }
label .hint { display: block; font-weight: 300; font-size: 13px; color: var(--muted); margin-top: 2px; }

input[type=text], input[type=email], input[type=tel], input[type=date], textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--navy); background: var(--white);
  transition: border-color 0.2s;
}
input:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(28,43,74,0.08); }
textarea { resize: vertical; min-height: 96px; }

.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-group.row { flex-direction: row; flex-wrap: wrap; }
.radio-opt {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
  font-size: 14px; background: var(--white); transition: all 0.15s;
  user-select: none;
}
.radio-opt:hover { border-color: var(--navy); background: #EEF1F8; }
.radio-opt.on { border-color: var(--navy); background: #EEF1F8; font-weight: 500; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; transition: all 0.15s; }
.radio-opt.on .dot { border-color: var(--navy); background: var(--navy); box-shadow: inset 0 0 0 3px #fff; }

/* compact frequency rows */
.radio-group.freq { flex-direction: row; flex-wrap: wrap; gap: 7px; }
.radio-group.freq .radio-opt { padding: 8px 12px; font-size: 13.5px; gap: 8px; }
.radio-group.freq .dot { width: 14px; height: 14px; }

.check-group { display: flex; flex-direction: column; gap: 8px; }
.check-group.row { flex-direction: row; flex-wrap: wrap; }
.check-opt {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
  font-size: 14px; background: var(--white); transition: all 0.15s;
  user-select: none;
}
.check-opt:hover { border-color: var(--navy); background: #EEF1F8; }
.check-opt.on { border-color: var(--navy); background: #EEF1F8; font-weight: 500; }
.box { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--border); flex-shrink: 0; transition: all 0.15s; display:flex; align-items:center; justify-content:center; }
.check-opt.on .box { border-color: var(--navy); background: var(--navy); }
.check-opt.on .box::after { content:''; width:8px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); display:block; }

.pair { display: flex; gap: 12px; }
.pair > div { flex: 1; }

.scale-row { display: flex; gap: 6px; flex-wrap: wrap; }
.scale-btn {
  width: 42px; height: 42px; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; color: var(--navy);
}
.scale-btn:hover { border-color: var(--navy); background: #EEF1F8; }
.scale-btn.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }

.err { color: var(--error); font-size: 13px; margin-top: 5px; display: none; }
.field.bad input, .field.bad textarea { border-color: var(--error); }
.field.bad .err { display: block; }

.submit-err {
  display: none; background: #FDECEA; border: 1px solid var(--error); color: #8E2A1F;
  border-radius: 10px; padding: 15px 17px; font-size: 14px; line-height: 1.6; margin-top: 22px;
}
.submit-err a { color: #8E2A1F; }
.submit-err .tech { display: block; margin-top: 9px; font-size: 11.5px; color: #9A8683; font-weight: 300; }

.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; }
.btn-back { padding: 12px 22px; border: 1.5px solid var(--border); border-radius: 8px; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--muted); cursor: pointer; transition: all 0.2s; }
.btn-back:hover { border-color: var(--navy); color: var(--navy); }
.btn-next { padding: 13px 28px; background: var(--navy); border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer; transition: background 0.2s; margin-left: auto; }
.btn-next:hover { background: #2A3F6B; }

.consent-box { background: #FFFBEA; border: 1px solid var(--yellow); border-radius: 10px; padding: 18px; font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
.consent-box strong { color: var(--navy); }
